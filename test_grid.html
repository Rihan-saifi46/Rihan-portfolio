<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Interactive Diamond Box Grid Prototype</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #08080c; overflow: hidden; width: 100vw; height: 100vh; }
    #canvas { width: 100%; height: 100%; display: block; }
  </style>
  <script src="assets/js/three.min.js"></script>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script>
    const canvas = document.getElementById('canvas');
    const width = window.innerWidth;
    const height = window.innerHeight;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(36, width / height, 1, 5000);

    const renderer = new THREE.WebGLRenderer({
      canvas: canvas,
      alpha: true,
      antialias: true
    });
    renderer.setSize(width, height, false);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

    // Camera setup with gentle oblique angle (~26 deg)
    const TILT_DEG = 26;
    const fovRad = (36 * Math.PI) / 180;
    const tiltRad = (TILT_DEG * Math.PI) / 180;
    const camDist = (height * 0.5) / Math.tan(fovRad * 0.5);
    camera.position.set(0, -camDist * Math.sin(tiltRad), camDist * Math.cos(tiltRad));
    camera.lookAt(0, 0, 0);

    // Lighting
    const ambientLight = new THREE.AmbientLight(0x3a3f50, 2.2);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 2.2);
    dirLight.position.set(150, -300, 500);
    scene.add(dirLight);

    // Dynamic cursor point light (pink-white radiance)
    const pointLight = new THREE.PointLight(0xf472b6, 0, 480);
    pointLight.position.set(0, 0, 80);
    scene.add(pointLight);

    // Procedural Squircle Shape
    function createSquircleShape(size, radius) {
      const shape = new THREE.Shape();
      const half = size * 0.5;
      const r = radius;
      shape.moveTo(-half + r, -half);
      shape.lineTo(half - r, -half);
      shape.quadraticCurveTo(half, -half, half, -half + r);
      shape.lineTo(half, half - r);
      shape.quadraticCurveTo(half, half, half - r, half);
      shape.lineTo(-half + r, half);
      shape.quadraticCurveTo(-half, half, -half, half - r);
      shape.lineTo(-half, -half + r);
      shape.quadraticCurveTo(-half, -half, -half + r, -half);
      return shape;
    }

    const TILE_SIZE = 44;
    const TILE_RADIUS = 10;
    const TILE_DEPTH = 10;
    const BEVEL_SIZE = 2.0;
    const BEVEL_THICK = 2.0;

    const shape = createSquircleShape(TILE_SIZE, TILE_RADIUS);
    const tileGeo = new THREE.ExtrudeGeometry(shape, {
      depth: TILE_DEPTH,
      bevelEnabled: true,
      bevelSegments: 3,
      steps: 1,
      bevelSize: BEVEL_SIZE,
      bevelThickness: BEVEL_THICK
    });
    tileGeo.center();

    // Tile Material
    const tileMat = new THREE.MeshStandardMaterial({
      roughness: 0.35,
      metalness: 0.45
    });

    // Icon textures
    function createIconTexture(type) {
      const c = document.createElement('canvas');
      c.width = 64; c.height = 64;
      const ctx = c.getContext('2d');
      ctx.clearRect(0, 0, 64, 64);
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#ffffff';

      if (type === 'sparkle') {
        ctx.beginPath();
        ctx.moveTo(32, 10);
        ctx.quadraticCurveTo(32, 28, 54, 32);
        ctx.quadraticCurveTo(32, 36, 32, 54);
        ctx.quadraticCurveTo(32, 36, 10, 32);
        ctx.quadraticCurveTo(32, 28, 32, 10);
        ctx.fill();
      } else if (type === 'asterisk') {
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        for (let a = 0; a < 8; a++) {
          const ang = a * Math.PI / 4;
          ctx.beginPath();
          ctx.moveTo(32 + Math.cos(ang) * 5, 32 + Math.sin(ang) * 5);
          ctx.lineTo(32 + Math.cos(ang) * 19, 32 + Math.sin(ang) * 19);
          ctx.stroke();
        }
      } else if (type === 'burst') {
        ctx.lineWidth = 2.4;
        ctx.lineCap = 'round';
        for (let a = 0; a < 12; a++) {
          const ang = a * Math.PI / 6;
          ctx.beginPath();
          ctx.moveTo(32 + Math.cos(ang) * 5, 32 + Math.sin(ang) * 5);
          ctx.lineTo(32 + Math.cos(ang) * 18, 32 + Math.sin(ang) * 18);
          ctx.stroke();
        }
      } else if (type === 'spiral') {
        ctx.lineWidth = 2.6;
        for (let i = 0; i < 6; i++) {
          const ang = i * Math.PI / 3;
          ctx.beginPath();
          ctx.arc(32 + Math.cos(ang) * 7, 32 + Math.sin(ang) * 7, 7, 0, Math.PI * 2);
          ctx.stroke();
        }
      }

      const tex = new THREE.CanvasTexture(c);
      tex.needsUpdate = true;
      return tex;
    }

    const iconTexs = [
      createIconTexture('sparkle'),
      createIconTexture('asterisk'),
      createIconTexture('burst'),
      createIconTexture('spiral')
    ];

    const iconMats = iconTexs.map(tex => new THREE.MeshBasicMaterial({
      map: tex,
      transparent: true,
      opacity: 0.45,
      depthWrite: false
    }));

    const iconGeo = new THREE.PlaneGeometry(16, 16);

    const physicalSize = TILE_SIZE + BEVEL_SIZE * 2;
    const gap = 8;
    const pitch = physicalSize + gap;
    const invSqrt2 = Math.SQRT1_2;

    const spanX = width * 1.5;
    const spanY = height * 1.5;
    const countU = Math.ceil(spanX / (pitch * invSqrt2)) + 4;
    const countV = Math.ceil(spanY / (pitch * invSqrt2)) + 4;

    const tiles = [];
    const minU = -Math.floor(countU / 2);
    const maxU = Math.floor(countU / 2);
    const minV = -Math.floor(countV / 2);
    const maxV = Math.floor(countV / 2);

    for (let u = minU; u <= maxU; u++) {
      for (let v = minV; v <= maxV; v++) {
        const x = (u - v) * pitch * invSqrt2;
        const y = (u + v) * pitch * invSqrt2;

        if (Math.abs(x) < spanX * 0.6 && Math.abs(y) < spanY * 0.65) {
          const hash = Math.abs((u * 73856093 ^ v * 19349663) % 100);
          let iconType = -1;
          if (hash < 8) iconType = 0;
          else if (hash < 16) iconType = 1;
          else if (hash < 24) iconType = 2;
          else if (hash < 32) iconType = 3;

          tiles.push({
            u, v, x, y,
            z: 0,
            vz: 0,
            targetZ: 0,
            light: 0,
            iconType: iconType
          });
        }
      }
    }

    const totalCount = tiles.length;
    const tileMesh = new THREE.InstancedMesh(tileGeo, tileMat, totalCount);
    scene.add(tileMesh);

    const iconMeshes = [];
    const iconInstances = [[], [], [], []];

    tiles.forEach((t, idx) => {
      if (t.iconType >= 0) {
        iconInstances[t.iconType].push({ tileIdx: idx, tile: t });
      }
    });

    for (let k = 0; k < 4; k++) {
      const im = new THREE.InstancedMesh(iconGeo, iconMats[k], iconInstances[k].length);
      scene.add(im);
      iconMeshes.push(im);
    }

    const dummy = new THREE.Object3D();
    const tempColor = new THREE.Color();
    const tempIconColor = new THREE.Color();

    const colorBase = new THREE.Color(0x101217);
    const colorPink = new THREE.Color(0xf472b6);
    const colorMagenta = new THREE.Color(0xdb2777);
    const colorMauve = new THREE.Color(0x701a75);
    const colorCyan = new THREE.Color(0x38bdf8);
    const colorWhite = new THREE.Color(0xffffff);
    const colorPalePink = new THREE.Color(0xfde2e8);

    const colorIconBase = new THREE.Color(0x525666);
    const colorIconLit = new THREE.Color(0xffffff);

    function updateWave(centerX = 0, centerY = 0, intensity = 1.0) {
      const radius = 240;

      pointLight.position.set(centerX, centerY, 70);
      pointLight.intensity = intensity * 3.5;

      for (let i = 0; i < totalCount; i++) {
        const t = tiles[i];
        const dx = t.x - centerX;
        const dy = t.y - centerY;
        const distSq = dx * dx + dy * dy;
        const dist = Math.sqrt(distSq);

        let targetZ = 0;
        let lightVal = 0;

        if (dist < radius) {
          const norm = 1.0 - (dist / radius);
          const bell = Math.cos((dist / radius) * Math.PI * 0.5);
          targetZ = Math.pow(bell, 1.8) * 24.0 * intensity;
          lightVal = Math.pow(norm, 1.3) * intensity;
        }

        t.z = targetZ;
        t.light = lightVal;

        dummy.position.set(t.x, t.y, t.z);
        dummy.rotation.set(0, 0, Math.PI * 0.25);
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();
        tileMesh.setMatrixAt(i, dummy.matrix);

        if (lightVal > 0.01) {
          if (lightVal > 0.75) {
            const f = (lightVal - 0.75) / 0.25;
            tempColor.copy(colorPalePink).lerp(colorWhite, f);
          } else if (lightVal > 0.35) {
            const f = (lightVal - 0.35) / 0.4;
            tempColor.copy(colorMagenta).lerp(colorPink, f);
          } else {
            const f = lightVal / 0.35;
            tempColor.copy(colorBase).lerp(colorMauve, f);
          }
        } else {
          tempColor.copy(colorBase);
        }

        tileMesh.setColorAt(i, tempColor);
      }

      tileMesh.instanceMatrix.needsUpdate = true;
      if (tileMesh.instanceColor) tileMesh.instanceColor.needsUpdate = true;

      const topOffset = (TILE_DEPTH + BEVEL_THICK * 2) * 0.5 + 0.35;

      for (let k = 0; k < 4; k++) {
        const list = iconInstances[k];
        const im = iconMeshes[k];
        for (let j = 0; j < list.length; j++) {
          const t = list[j].tile;
          dummy.position.set(t.x, t.y, t.z + topOffset);
          dummy.rotation.set(0, 0, Math.PI * 0.25);
          dummy.scale.set(1, 1, 1);
          dummy.updateMatrix();
          im.setMatrixAt(j, dummy.matrix);

          if (t.light > 0.05) {
            tempIconColor.copy(colorIconBase).lerp(colorIconLit, Math.min(1.0, t.light * 1.5));
          } else {
            tempIconColor.copy(colorIconBase);
          }
          im.setColorAt(j, tempIconColor);
        }
        im.instanceMatrix.needsUpdate = true;
        if (im.instanceColor) im.instanceColor.needsUpdate = true;
      }

      renderer.render(scene, camera);
    }

    updateWave(0, 0, 1.0);
    window.__updateWave = updateWave;
  </script>
</body>
</html>
